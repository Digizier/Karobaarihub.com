<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#804A00" />
    </linearGradient>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B1E2D" />
      <stop offset="100%" stop-color="#550D16" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Ring with Gold Border -->
  <circle cx="256" cy="256" r="236" fill="url(#maroonGrad)" stroke="url(#goldGrad)" stroke-width="16" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="8,8" opacity="0.85"/>

  <!-- Center Decorative Shield -->
  <path d="M 256 95 L 365 148 L 365 270 Q 365 375 256 420 Q 147 375 147 270 L 147 148 Z" fill="#3B050B" stroke="url(#goldGrad)" stroke-width="8"/>

  <!-- Crown on Top -->
  <polygon points="256,110 230,135 240,140 256,125 272,140 282,135" fill="url(#goldGrad)"/>
  <circle cx="230" cy="132" r="4" fill="#FFD700"/>
  <circle cx="256" cy="107" r="5" fill="#FFD700"/>
  <circle cx="282" cy="132" r="4" fill="#FFD700"/>

  <!-- KH Monogram in Gold -->
  <g fill="url(#goldGrad)">
    <!-- K letter -->
    <path d="M 190 170 L 220 170 L 220 340 L 190 340 Z"/>
    <path d="M 220 250 L 265 170 L 298 170 L 245 255 L 305 340 L 270 340 L 220 268 Z"/>

    <!-- H letter -->
    <path d="M 315 170 L 345 170 L 345 340 L 315 340 Z"/>
  </g>

  <!-- HUB Ribbon / Tag -->
  <rect x="176" y="370" width="160" height="38" rx="8" fill="url(#goldGrad)"/>
  <text x="256" y="396" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="22" fill="#550D16" text-anchor="middle" letter-spacing="4">HUB</text>
</svg>